<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 905" width="1100" height="905" font-family="Arial, Helvetica, sans-serif">
  <rect width="1100" height="905" fill="#ffffff"/>

  <!-- Title -->
  <text x="30" y="42" font-size="24" font-weight="bold" fill="#111">Curl Strap – hardware setup</text>
  <text x="30" y="66" font-size="14" fill="#555">Arduino UNO R4 (Minima or WiFi) + BMX160 motion sensor · 4 wires · optional green/red LEDs</text>

  <!-- ===================== WIRING DIAGRAM ===================== -->
  <text x="30" y="108" font-size="16" font-weight="bold" fill="#111">1. Wiring (do this with the USB cable unplugged)</text>

  <!-- Laptop -->
  <rect x="22" y="212" width="96" height="62" rx="4" fill="#e9eef3" stroke="#555" stroke-width="2"/>
  <rect x="30" y="219" width="80" height="47" fill="#cfe3f5"/>
  <path d="M14 278 H126 L118 288 H22 Z" fill="#bfc8d0" stroke="#555" stroke-width="2"/>
  <text x="70" y="306" font-size="12" text-anchor="middle" fill="#333">Laptop</text>
  <text x="70" y="321" font-size="11" text-anchor="middle" fill="#666">(Arduino IDE)</text>
  <!-- USB cable -->
  <path d="M118 245 C140 245 140 252 160 252" fill="none" stroke="#777" stroke-width="5" stroke-linecap="round"/>
  <text x="139" y="236" font-size="10" text-anchor="middle" fill="#666">USB-C</text>

  <!-- Arduino board -->
  <rect x="170" y="195" width="420" height="275" rx="12" fill="#00878F" stroke="#005f65" stroke-width="2"/>
  <rect x="158" y="236" width="28" height="32" rx="3" fill="#c9c9c9" stroke="#888"/>
  <text x="380" y="318" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">Arduino UNO R4</text>
  <text x="380" y="340" font-size="13" fill="#e6fbfc" text-anchor="middle">(Minima or WiFi)</text>
  <!-- L LED -->
  <circle cx="300" cy="262" r="6" fill="#ff9d00" stroke="#fff" stroke-width="1.5"/>
  <text x="312" y="266" font-size="11" fill="#fff">"L" LED = rep feedback</text>
  <text x="475" y="398" font-size="10" fill="#e6fbfc" text-anchor="middle">A4 / A5 = same signals as SDA / SCL</text>

  <!-- Top header -->
  <rect x="204" y="204" width="362" height="22" fill="#1b1b1b"/>
  <g fill="#d4b26a">
    <rect x="210" y="210" width="10" height="10"/><rect x="230" y="210" width="10" height="10"/>
    <rect x="250" y="210" width="10" height="10"/><rect x="270" y="210" width="10" height="10"/>
    <rect x="290" y="210" width="10" height="10"/><rect x="310" y="210" width="10" height="10"/>
    <rect x="330" y="210" width="10" height="10"/><rect x="350" y="210" width="10" height="10"/>
    <rect x="370" y="210" width="10" height="10"/><rect x="390" y="210" width="10" height="10"/>
    <rect x="410" y="210" width="10" height="10"/><rect x="430" y="210" width="10" height="10"/>
    <rect x="450" y="210" width="10" height="10"/><rect x="470" y="210" width="10" height="10"/>
    <rect x="490" y="210" width="10" height="10"/><rect x="510" y="210" width="10" height="10"/>
    <rect x="530" y="210" width="10" height="10"/><rect x="550" y="210" width="10" height="10"/>
  </g>
  <g font-size="9" fill="#fff">
    <text transform="translate(219 231) rotate(90)">SCL</text>
    <text transform="translate(239 231) rotate(90)">SDA</text>
    <text transform="translate(259 231) rotate(90)">AREF</text>
    <text transform="translate(279 231) rotate(90)">GND</text>
    <text transform="translate(299 231) rotate(90)" opacity="0.7">13</text>
    <text transform="translate(319 231) rotate(90)" opacity="0.7">12</text>
    <text transform="translate(339 231) rotate(90)" opacity="0.7">11</text>
    <text transform="translate(359 231) rotate(90)" opacity="0.7">10</text>
    <text transform="translate(379 231) rotate(90)" opacity="0.7">9</text>
    <text transform="translate(399 231) rotate(90)" opacity="0.7">8</text>
    <text transform="translate(419 231) rotate(90)" opacity="0.7">7</text>
    <text transform="translate(439 231) rotate(90)" opacity="0.7">6</text>
    <text transform="translate(459 231) rotate(90)" opacity="0.7">5</text>
    <text transform="translate(479 231) rotate(90)" opacity="0.7">4</text>
    <text transform="translate(499 231) rotate(90)">3</text>
    <text transform="translate(519 231) rotate(90)">2</text>
    <text transform="translate(539 231) rotate(90)" opacity="0.7">1</text>
    <text transform="translate(559 231) rotate(90)" opacity="0.7">0</text>
  </g>

  <!-- Bottom header -->
  <rect x="244" y="439" width="162" height="22" fill="#1b1b1b"/>
  <rect x="414" y="439" width="122" height="22" fill="#1b1b1b"/>
  <g fill="#d4b26a">
    <rect x="250" y="445" width="10" height="10"/><rect x="270" y="445" width="10" height="10"/>
    <rect x="290" y="445" width="10" height="10"/><rect x="310" y="445" width="10" height="10"/>
    <rect x="330" y="445" width="10" height="10"/><rect x="350" y="445" width="10" height="10"/>
    <rect x="370" y="445" width="10" height="10"/><rect x="390" y="445" width="10" height="10"/>
    <rect x="420" y="445" width="10" height="10"/><rect x="440" y="445" width="10" height="10"/>
    <rect x="460" y="445" width="10" height="10"/><rect x="480" y="445" width="10" height="10"/>
    <rect x="500" y="445" width="10" height="10"/><rect x="520" y="445" width="10" height="10"/>
  </g>
  <g font-size="9" fill="#fff">
    <text transform="translate(279 434) rotate(-90)" opacity="0.7">IOREF</text>
    <text transform="translate(299 434) rotate(-90)" opacity="0.7">RESET</text>
    <text transform="translate(319 434) rotate(-90)">3.3V</text>
    <text transform="translate(339 434) rotate(-90)">5V</text>
    <text transform="translate(359 434) rotate(-90)">GND</text>
    <text transform="translate(379 434) rotate(-90)" opacity="0.7">GND</text>
    <text transform="translate(399 434) rotate(-90)" opacity="0.7">VIN</text>
    <text transform="translate(429 434) rotate(-90)" opacity="0.7">A0</text>
    <text transform="translate(449 434) rotate(-90)" opacity="0.7">A1</text>
    <text transform="translate(469 434) rotate(-90)" opacity="0.7">A2</text>
    <text transform="translate(489 434) rotate(-90)" opacity="0.7">A3</text>
    <text transform="translate(509 434) rotate(-90)">A4</text>
    <text transform="translate(529 434) rotate(-90)">A5</text>
  </g>
  <!-- 5V alternative marker -->
  <circle cx="335" cy="450" r="11" fill="none" stroke="#d62728" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- BMX160 board (8-pin version) -->
  <text x="895" y="218" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">BMX160 sensor board</text>
  <rect x="810" y="230" width="170" height="260" rx="8" fill="#2f3f8f" stroke="#1d2960" stroke-width="2"/>
  <rect x="915" y="275" width="50" height="50" rx="3" fill="#111"/>
  <text x="940" y="304" font-size="10" fill="#ddd" text-anchor="middle">BMX160</text>
  <g fill="#d4b26a" stroke="#8a6d2b">
    <circle cx="815" cy="260" r="5"/><circle cx="815" cy="290" r="5"/>
    <circle cx="815" cy="320" r="5"/><circle cx="815" cy="350" r="5"/>
    <circle cx="815" cy="380" r="5"/><circle cx="815" cy="410" r="5"/>
    <circle cx="815" cy="440" r="5"/><circle cx="815" cy="470" r="5"/>
  </g>
  <g font-size="12" font-weight="bold" fill="#fff">
    <text x="826" y="264">SCL</text>
    <text x="826" y="294">SDA</text>
    <text x="826" y="324">GND</text>
    <text x="826" y="354">VCC</text>
    <text x="826" y="384">CSB</text>
    <text x="826" y="414">SDO</text>
    <text x="826" y="444" opacity="0.7">INT1</text>
    <text x="826" y="474" opacity="0.7">INT2</text>
  </g>
  <g font-size="11" fill="#ffd966">
    <text x="862" y="384">→ 3.3V</text>
    <text x="862" y="414">→ GND</text>
    <text x="866" y="444" fill="#c9d1f0">(leave free)</text>
    <text x="866" y="474" fill="#c9d1f0">(leave free)</text>
  </g>
  <text x="812" y="510" font-size="11" fill="#333">CSB → 3.3V keeps the chip in I2C mode; SDO → GND</text>
  <text x="812" y="525" font-size="11" fill="#333">sets address 0x68 (code also tries 0x69). 4-pin boards</text>
  <text x="812" y="540" font-size="11" fill="#333">have no CSB/SDO: leave any ADDR switch as it is.</text>
  <text x="812" y="558" font-size="10.5" fill="#b00">Pin ORDER differs between boards: match the LABELS.</text>

  <!-- Wires -->
  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M215 215 V150 H760 V260 H812" stroke="#e0a800"/>
    <path d="M235 215 V170 H740 V290 H812" stroke="#1f6fd1"/>
    <path d="M355 450 V500 H770 V320 H812" stroke="#222"/>
    <path d="M315 450 V520 H790 V350 H812" stroke="#d62728"/>
  </g>
  <g font-size="12" font-weight="bold">
    <text x="470" y="143" fill="#a07800">SCL (clock)  ·  Arduino SCL → sensor SCL</text>
    <text x="470" y="164" fill="#1f6fd1">SDA (data)  ·  Arduino SDA → sensor SDA</text>
    <text x="470" y="493" fill="#222">GND (ground)  ·  Arduino GND → sensor GND</text>
    <text x="470" y="538" fill="#d62728">VCC (power)  ·  Arduino 3.3V → sensor VCC</text>
  </g>
  <text x="470" y="556" font-size="11" fill="#d62728">Use 5V (dashed circle) only if your board says "3.3V–5V".</text>

  <!-- Optional green / red LEDs on pins 2 and 3 -->
  <g fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M495 215 V184 H690 V250" stroke="#c0392b"/>
    <path d="M515 215 V192 H640 V250" stroke="#2e9e4f"/>
    <path d="M640 282 V297 M640 315 V332 M690 282 V297 M690 315 V332" stroke="#444"/>
  </g>
  <g stroke="#444" stroke-width="1.5">
    <rect x="634" y="250" width="12" height="32" fill="#e8d9b5"/>
    <rect x="684" y="250" width="12" height="32" fill="#e8d9b5"/>
    <path d="M630 332 H650 M634 337 H646 M638 342 H642 M680 332 H700 M684 337 H696 M688 342 H692" fill="none" stroke-width="2"/>
  </g>
  <circle cx="640" cy="306" r="9" fill="#2ecc71" stroke="#1e7a44" stroke-width="2"/>
  <circle cx="690" cy="306" r="9" fill="#e74c3c" stroke="#922b21" stroke-width="2"/>
  <g font-size="10" text-anchor="middle" fill="#333">
    <text x="640" y="360" font-weight="bold" fill="#1e7a44">green</text>
    <text x="640" y="373">pin 2</text>
    <text x="690" y="360" font-weight="bold" fill="#922b21">red</text>
    <text x="690" y="373">pin 3</text>
    <text x="665" y="398" font-size="11" font-weight="bold" fill="#111">Optional LEDs</text>
    <text x="665" y="412">470 Ω each · long leg (+)</text>
    <text x="665" y="424">toward pin · short leg → GND</text>
  </g>

  <!-- ===================== HOW IT'S WORN ===================== -->
  <line x1="30" y1="580" x2="1070" y2="580" stroke="#ddd" stroke-width="2"/>
  <text x="30" y="612" font-size="16" font-weight="bold" fill="#111">2. How it's worn</text>

  <!-- table -->
  <rect x="340" y="770" width="225" height="9" fill="#8b5a2b"/>
  <line x1="355" y1="779" x2="355" y2="850" stroke="#8b5a2b" stroke-width="6"/>
  <line x1="550" y1="779" x2="550" y2="850" stroke="#8b5a2b" stroke-width="6"/>
  <!-- arduino on table -->
  <rect x="365" y="748" width="70" height="22" rx="3" fill="#00878F"/>
  <text x="400" y="763" font-size="9" fill="#fff" text-anchor="middle">UNO R4</text>
  <!-- laptop on table -->
  <rect x="472" y="712" width="76" height="50" rx="3" fill="#e9eef3" stroke="#555" stroke-width="2"/>
  <rect x="478" y="718" width="64" height="38" fill="#cfe3f5"/>
  <path d="M464 762 H558 L552 770 H470 Z" fill="#bfc8d0" stroke="#555" stroke-width="1.5"/>
  <path d="M435 760 C452 760 452 766 470 766" fill="none" stroke="#777" stroke-width="3"/>
  <text x="510" y="705" font-size="10" fill="#555" text-anchor="middle">Serial Monitor</text>

  <!-- person (side view) -->
  <circle cx="110" cy="648" r="18" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="110" y1="666" x2="110" y2="770" stroke="#333" stroke-width="4"/>
  <line x1="110" y1="770" x2="95" y2="850" stroke="#333" stroke-width="4"/>
  <line x1="110" y1="770" x2="125" y2="850" stroke="#333" stroke-width="4"/>
  <!-- upper arm and forearm -->
  <line x1="112" y1="680" x2="112" y2="742" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <line x1="112" y1="742" x2="182" y2="722" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <!-- dumbbell -->
  <rect x="180" y="708" width="8" height="28" rx="2" fill="#555"/>
  <line x1="176" y1="722" x2="192" y2="722" stroke="#555" stroke-width="4"/>
  <!-- strap -->
  <line x1="133" y1="725" x2="139" y2="746" stroke="#2f3f8f" stroke-width="10"/>
  <!-- sensor wire taped along upper arm to the Arduino -->
  <path d="M134 728 C122 718 119 700 119 684 C160 650 330 680 380 748" fill="none" stroke="#e0a800" stroke-width="2.5" stroke-dasharray="7 4"/>
  <!-- callouts -->
  <line x1="141" y1="752" x2="150" y2="782" stroke="#2f3f8f" stroke-width="1.5"/>
  <text x="140" y="796" font-size="12" font-weight="bold" fill="#2f3f8f">Strap + sensor: forearm,</text>
  <text x="140" y="811" font-size="12" font-weight="bold" fill="#2f3f8f">a hand-width below the elbow</text>
  <text x="140" y="826" font-size="11" fill="#2f3f8f">snug, any way up</text>
  <text x="200" y="634" font-size="11" fill="#7a5c00">4 long wires (30 cm+), taped along</text>
  <text x="200" y="648" font-size="11" fill="#7a5c00">the upper arm so curls don't pull them</text>

  <!-- ===================== CHECKLIST ===================== -->
  <rect x="580" y="598" width="490" height="292" rx="10" fill="#f5f7fa" stroke="#d5dbe3"/>
  <text x="600" y="626" font-size="15" font-weight="bold" fill="#111">Checklist</text>
  <g font-size="12" fill="#222">
    <text x="600" y="652">1. Unplug USB before changing any wires.</text>
    <text x="600" y="674">2. SCL→SCL, SDA→SDA, GND→GND, VCC→3.3V (5V only if "3.3V–5V").</text>
    <text x="600" y="696">3. Match the pin LABELS on your sensor, not the order in this picture.</text>
    <text x="600" y="718">4. 8-pin board: CSB→3.3V, SDO→GND, INT1/INT2 unconnected.</text>
    <text x="600" y="740">5. Optional: pin 2 → 470 Ω → green LED, pin 3 → 470 Ω → red LED.</text>
    <text x="600" y="762">6. USB to laptop → Upload → Serial Monitor at 115200 baud.</text>
    <text x="600" y="784">7. Type s + Enter, let the arm hang still, wait for GO!, then curl.</text>
    <text x="600" y="812" font-weight="bold">Feedback after each rep:</text>
    <text x="616" y="832">• green LED 1 s = good rep    • red LED 1 s = rep needs work</text>
    <text x="616" y="852">• orange "L" LED: on 1 s = good, 3 quick blinks = needs work</text>
    <text x="616" y="872">• fast blinking right after power-up = sensor not found (check wires)</text>
  </g>
</svg>
